name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Zip ac
        run: unzip -q proje.zip -d proje
      - name: Derle
        working-directory: proje
        run: |
          set +e
          gradle build --no-daemon > ../build.log 2>&1
          code=$?
          echo '### Hata satirlari' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|What went wrong|FAILURE|Could not|not found" -A3 ../build.log | head -70 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: modid-jar
          path: proje/build/libs/modid-1.0.0.jar
